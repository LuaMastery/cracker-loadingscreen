<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cracker Games BR - Carregando</title>
<link rel="stylesheet" href="css/style.css?v=1789524759">
</head>
<body>

	<div id="bg-layers"></div>
	<div class="bg-dim"></div>
	<div class="bg-tint"></div>
	<div class="bg-overlay"></div>

	<div class="corner-deco corner-deco--tl"></div>
	<div class="corner-deco corner-deco--tr"></div>

	<div class="screen">

		<header class="topbar">
			<div class="brand">
				<img id="brand-logo" class="brand-logo pixel-frame" src="" alt="Cracker Games BR" hidden>
				<div class="brand-text">
					<span class="brand-mark">CRACKER<span>GAMES</span>BR</span>
					<span id="brand-credit" class="brand-credit" hidden></span>
				</div>
			</div>
			<div class="server-info">
				<span id="server-name">Cracker Games BR</span>
				<span id="map-name"></span>
			</div>
		</header>

		<div class="panels">
			<section id="panel-curiosidades" class="panel-card pixel-frame">
				<h3>Você sabia?</h3>
				<p id="curiosity-text" class="curiosity fade-in"></p>
			</section>

			<section id="panel-fanarts" class="panel-card pixel-frame">
				<h3>Fanarts da comunidade</h3>
				<div id="fanart-grid" class="fanart-grid"></div>
			</section>

			<section id="panel-perfil" class="panel-card pixel-frame">
				<h3>Meu Perfil</h3>
				<div id="profile-body" class="profile-body"></div>
			</section>

			<section id="panel-servidor" class="panel-card pixel-frame">
				<h3>Servidor</h3>
				<div id="server-info-body" class="server-info-body"></div>
			</section>

			<section id="panel-mods" class="panel-card pixel-frame">
				<h3>Mods &amp; Arquivos</h3>
				<div id="mods-body" class="mods-body"></div>
			</section>

			<section id="panel-clima" class="panel-card pixel-frame">
				<h3>Clima &amp; Horário</h3>
				<div id="clima-body" class="clima-body"></div>
			</section>

			<section id="panel-musica" class="panel-card pixel-frame">
				<h3>Música</h3>
				<div id="music-body" class="music-body"></div>
			</section>

			<section id="panel-creditos" class="panel-card pixel-frame">
				<h3>Créditos</h3>
				<div id="credits-body" class="credits-body"></div>
			</section>
		</div>

		<footer class="footer">
			<div class="progress-wrap">
				<div class="progress-track">
					<div id="progress-bar" class="progress-fill"></div>
				</div>
				<div class="footer-status">
					<div class="progress-meta">
						<span id="status-text">Conectando...</span>
						<span id="progress-label"></span>
					</div>
					<div id="eta-text" class="eta-text"></div>
				</div>
			</div>
		</footer>

	</div>

	<script src="js/config.js?v=1789524759"></script>
	<script src="js/main.js?v=1789524759"></script>
</body>
</html>
