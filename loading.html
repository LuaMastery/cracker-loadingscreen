<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cracker Games BR - Carregando</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

	<div id="bg-layers"></div>
	<div class="bg-tint"></div>
	<div class="bg-overlay"></div>

	<div class="screen">

		<header class="topbar">
			<div class="brand">
				<img id="brand-logo" class="brand-logo pixel-frame" src="" alt="Cracker Games BR" hidden>
				<div class="brand-text">
					<span class="brand-mark">CRACKER<span>GAMES</span>BR</span>
					<span id="brand-credit" class="brand-credit" hidden></span>
				</div>
			</div>
			<div class="server-info">
				<span id="server-name">Cracker Games BR</span>
				<span id="map-name"></span>
			</div>
		</header>

		<main class="content pixel-frame">
			<nav class="tabs">
				<button class="tab-button active" data-tab="curiosidades">Curiosidades</button>
				<button class="tab-button" data-tab="fanarts">Fanarts</button>
				<button class="tab-button" data-tab="perfil">Meu Perfil</button>
			</nav>

			<div class="panels">
				<section id="panel-curiosidades" class="tab-panel active">
					<h3>Você sabia?</h3>
					<p id="curiosity-text" class="curiosity fade-in"></p>
				</section>

				<section id="panel-fanarts" class="tab-panel">
					<h3>Fanarts da comunidade</h3>
					<div id="fanart-grid" class="fanart-grid"></div>
				</section>

				<section id="panel-perfil" class="tab-panel">
					<h3>Meu Perfil</h3>
					<div id="profile-body" class="profile-body"></div>
				</section>
			</div>
		</main>

		<footer class="footer">
			<div class="progress-wrap">
				<div class="progress-track">
					<div id="progress-bar" class="progress-fill"></div>
				</div>
				<div class="progress-meta">
					<span id="status-text">Conectando...</span>
					<span id="progress-label"></span>
				</div>
			</div>
			<a id="discord-link" class="discord-btn" href="#" target="_blank" rel="noopener">Discord</a>
		</footer>

	</div>

	<script src="js/config.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
